<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>Бизнес с нуля 5.6.3</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #bzBoot563{position:fixed;z-index:99999;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));padding:10px 12px;border-radius:14px;background:rgba(17,25,43,.94);border:1px solid rgba(130,150,190,.25);font-size:12px;color:#b9c6dd;box-shadow:0 12px 30px rgba(0,0,0,.28)}
    #bzBoot563 strong{display:block;color:#fff;margin-bottom:3px;font-size:13px}#bzBoot563.ok{opacity:0;pointer-events:none;transition:opacity .35s ease}#bzBoot563.err{color:#ffd0cc;border-color:rgba(255,110,100,.35)}
    #bzShell563{min-height:60vh;display:grid;place-items:center;text-align:center;padding:28px}#bzShell563 b{font-size:22px}#bzShell563 span{display:block;color:#8796af;margin-top:8px;font-size:13px}
  </style>
</head>
<body>
  <div id="bzShell563"><div><b>Бизнес с нуля</b><span>Запуск 5.6.3…</span></div></div>
  <div id="bzBoot563"><strong>Загрузка 5.6.3</strong><span id="bzBoot563Text">Подготавливаю интерфейс…</span></div>
  <script>
  (()=>{
    const VERSION='5.6.3';
    const BUILD='563';
    const status=document.getElementById('bzBoot563');
    const statusText=document.getElementById('bzBoot563Text');
    const errors=[];
    window.BZ_APP_VERSION=VERSION;
    window.BZ_CONFIG={API_BASE:'https://business-zero-backend.onrender.com',BOT_USERNAME:'BusinessZeroGameBot'};
    // Party Arena is isolated from startup in this recovery build.
    window.__BZ_PARTY_ARENA_V55__=true;

    const say=(text,kind='')=>{
      if(statusText)statusText.textContent=text;
      if(status){status.classList.remove('ok','err');if(kind)status.classList.add(kind)}
    };
    const remember=e=>{errors.push(String(e?.message||e||'unknown').slice(0,180));if(errors.length>8)errors.shift()};
    window.addEventListener('error',e=>remember(`${e.message||'JS error'} · ${String(e.filename||'').split('/').pop()}:${e.lineno||0}`));
    window.addEventListener('unhandledrejection',e=>remember(e.reason?.message||e.reason||'promise error'));

    function frame(){return new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))}
    function timeout(ms){return new Promise((_,rej)=>setTimeout(()=>rej(new Error('тайм-аут')),ms))}
    function loadCss(href){
      return new Promise(resolve=>{
        const l=document.createElement('link');l.rel='stylesheet';l.href=href;
        l.onload=()=>resolve(true);l.onerror=()=>{remember(`CSS ${href}`);resolve(false)};
        document.head.appendChild(l);
        setTimeout(()=>resolve(false),5000);
      });
    }
    function loadScript(src,ms=9000){
      return Promise.race([
        new Promise((resolve,reject)=>{
          const s=document.createElement('script');s.src=src;s.async=false;
          s.onload=()=>resolve(true);s.onerror=()=>reject(new Error(`не загрузился ${src}`));
          document.head.appendChild(s);
        }),timeout(ms)
      ]);
    }

    async function boot(){
      try{
        say('Получаю свежий интерфейс…');
        const r=await Promise.race([fetch(`./?shell=${BUILD}-${Date.now()}`,{cache:'no-store'}),timeout(7000)]);
        if(!r?.ok)throw new Error(`страница HTTP ${r?.status||0}`);
        const source=await r.text();
        const parsed=new DOMParser().parseFromString(source,'text/html');
        if(!parsed.querySelector('.app')||!parsed.getElementById('tab-home'))throw new Error('не найден интерфейс игры');

        document.body.innerHTML=parsed.body.innerHTML;
        const diag=document.createElement('div');diag.id='bzBoot563';diag.innerHTML='<strong>Загрузка 5.6.3</strong><span id="bzBoot563Text">Интерфейс готов…</span>';
        document.body.appendChild(diag);
        // references changed after replacing body
        window.__bz563Status=diag;
        await Promise.all([loadCss(`styles.css?v=${BUILD}`),loadCss(`minigame.css?v=${BUILD}`)]);
        await frame();

        const q=(text,kind='')=>{
          const d=document.getElementById('bzBoot563'),t=document.getElementById('bzBoot563Text');
          if(t)t.textContent=text;if(d){d.classList.remove('ok','err');if(kind)d.classList.add(kind)}
        };

        // Telegram SDK must never be allowed to block the shell.
        q('Подключаю Telegram…');
        try{await loadScript('https://telegram.org/js/telegram-web-app.js?63',3500)}catch(e){remember(e)}
        await frame();

        const modules=[
          'app.js','minigame.js','progression-v32.js','security-v33.js','admin-v34.js','store-v35.js',
          'ux-v37.js','ux-v37-patch.js','mobile-fix-v371.js','stability-v372.js','arcade-v39.js','ui-v39.js',
          'passive-income-v40.js','quest-state-v401.js','referral-v402.js','action-labels-v44.js','profile-cosmetics-v44.js',
          'store-personalization-v45.js','title-preview-fix-v451.js','profile-polish-v453.js','stat-text-fix-v454.js','affiliate-v46.js',
          'game-v50.js','v50-polish.js','season-market-fix-v502.js','cards-v51.js','cosmetic-access-v52.js',
          'social-racing-v53.js','racing-direction-v532.js','performance-v54.js','safe-overlay-v561.js','version-guard-v56.js'
        ];

        const nativeAdd=window.addEventListener.bind(window);
        window.addEventListener=function(type,listener,options){
          const out=nativeAdd(type,listener,options);
          if(type==='load'&&document.readyState==='complete')setTimeout(()=>{try{typeof listener==='function'?listener.call(window,new Event('load')):listener?.handleEvent?.(new Event('load'))}catch(e){remember(e)}},0);
          return out;
        };

        for(let i=0;i<modules.length;i++){
          const name=modules[i];
          q(`Модуль ${i+1}/${modules.length}: ${name}`);
          await frame();
          try{await loadScript(`${name}?v=${BUILD}`,8000)}catch(e){remember(e)}
        }
        window.addEventListener=nativeAdd;

        const badge=document.querySelector('.topbar .eyebrow');if(badge)badge.textContent=`BUSINESS GAME · ${VERSION}`;
        document.title=`Бизнес с нуля ${VERSION}`;
        const d=document.getElementById('bzBoot563');
        if(errors.length){
          q(`Готово. Пропущено ошибок: ${errors.length}`,'err');
          d.title=errors.join('\n');
          setTimeout(()=>d?.classList.add('ok'),2800);
        }else{
          q('Готово','ok');
        }
      }catch(e){
        remember(e);
        const d=document.getElementById('bzBoot563')||status;
        const t=document.getElementById('bzBoot563Text')||statusText;
        if(d)d.classList.add('err');if(t)t.textContent=`Ошибка запуска: ${String(e?.message||e)}`;
      }
    }
    boot();
  })();
  </script>
</body>
</html>

name: Comet Courier teaser video
on:
  push:
    branches: [comet-courier-launch]
    paths:
      - 'comet-courier/render_teaser.py'
      - '.github/workflows/comet-courier-teaser.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependency
        run: python -m pip install 'pillow==11.3.0'
      - name: Build original animated video
        run: python comet-courier/render_teaser.py
      - name: Create public release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create comet-courier-promo-v1 comet-courier/comet-courier-teaser.mp4             --title "COMET COURIER — promo assets"             --notes "Promotional animation for the free COMET COURIER browser game."             --target comet-courier-launch             --repo "$GITHUB_REPOSITORY" ||           gh release upload comet-courier-promo-v1 comet-courier/comet-courier-teaser.mp4             --clobber --repo "$GITHUB_REPOSITORY"
